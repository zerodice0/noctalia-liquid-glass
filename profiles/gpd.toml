# Cached wallpaper blur reduces live-scene work; user layout is preserved.
extends = "desktop"

[apps.ghostty]
background_opacity = 0.76

[noctalia.shell.panel]
glass_background_opacity = 0.34
glass_card_opacity = 0.28

[material]
background_opacity = 0.34
workspace_opacity = 0.28

[window_defaults]
blur_optimized = true

[umbriel.appearance.blur]
optimized = true
passes = 1
radius = 5
glass_strength = 22.0
glass_edge = 32.0
glass_dispersion = 0.0
glass_highlight = 0.16

[[umbriel.layer_rule]]
match.namespace = '^noctalia-(bar-.*|notification|dock|panel|attached-panel|osd|desktop-widget-.*)$'
blur = true
blur_ignore_alpha = 0.20
blur_optimized = true

# Optical distances are physical pixels. Layout dimensions are logical pixels.
[apps.ghostty]
background_opacity = 0.68
background_opacity_cells = true

# Defaults precede the machine's own rules, which retain higher priority.
[window_defaults]
opacity = 0.92
blur = true
blur_popups = true
blur_optimized = false

[noctalia.shell.panel]
transparency_mode = "glass"
glass_background_opacity = 0.28
glass_card_opacity = 0.24
borders = true
shadow = true

[noctalia.bar.default]
background_opacity = 0.38
border = "#FFFFFF55"
border_width = 0.75

[noctalia.dock]
background_opacity = 0.34
border = "#FFFFFF66"
border_width = 0.75

[noctalia.notification]
background_opacity = 0.60

[noctalia.osd]
background_opacity = 0.55

[umbriel.appearance]
corner_radius = 14
border_width = 1
outer_border_width = 1

[umbriel.overview]
background_blur = false

# RGB follows Noctalia's palette; these alpha values define the material.
[material]
background_opacity = 0.28
border_opacity = 0.65
outer_border_opacity = 0.20
overview_tint_opacity = 0.08
workspace_opacity = 0.22

[umbriel.appearance.blur]
enabled = true
optimized = false
passes = 2
radius = 4
noise = 0.006
brightness = 1.0
contrast = 1.0
saturation = 1.10
glass_strength = 38.0
glass_edge = 52.0
glass_dispersion = 0.09
glass_highlight = 0.22

[[umbriel.layer_rule]]
match.namespace = '^noctalia-(bar-.*|notification|dock|panel|attached-panel|osd|desktop-widget-.*)$'
blur = true
blur_ignore_alpha = 0.12
blur_optimized = false

# Ghostty controls only its background; keep text at full opacity.
[[umbriel.window_rule]]
match.app_id = '^com\.mitchellh\.ghostty$'
opacity = 1.0
blur = true

[[umbriel.window_rule]]
match.content_type = "game"
opacity = 1.0
blur = false

[[umbriel.window_rule]]
match.content_type = "video"
opacity = 1.0
blur = false

[[umbriel.window_rule]]
match.app_id = '^(steam_app_.*|gamescope|mpv|vlc|org\.videolan\.VLC)$'
opacity = 1.0
blur = false
